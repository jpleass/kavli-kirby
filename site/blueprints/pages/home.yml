# Each page blueprint must have a title, the title may be different from the file name
title: Home
options:
  changeStatus: false
  preview: "{{ page.frontendUrl }}"

tabs:
  content:
    label: Content
    columns:
      content:
        width: 2/3
        sections:
          content:
            type: fields
            fields:
              heading:
                type: writer
              promotedEvent:
                type: pages
                label: Promoted Event
                query: site.find('events').children.listed
                multiple: false
  blocks:
    extends: tabs/content
    columns:
      blocks:
        width: 2/3
        sections:
          blocks:
            type: fields
            headline: Blocks
            fields:
              layout:
                extends: fields/layout
              bottomLayout:
                type: layout
                extends: fields/layout
  seotab: seo
