# Each page blueprint must have a title, the title may be different from the file name
title: Home
options:
  changeStatus: false
  preview: "{{ page.frontendUrl }}"

tabs:
  content:
    icon: text
    label: content
    fields:
      layout:
        label: Layout
        type: layout
        settings:
          fields:
            align:
              type: select
              label: Alignment
              options:
                top: Top
                center: Center
                bottom: Bottom
              default: top
        layouts:
          - "1/1"
          - "1/2, 1/2"
        fieldsets:
          - heading
          - text
          - image
          - video
          - quote
          - gap
          # - gallery
          - expand
