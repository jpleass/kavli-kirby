label: Data
columns:
  data:
    width: 2/3
    sections:
      data:
        type: fields
        headline: Blocks
        fields:
          cover:
            type: blocks
            label: Cover
            fieldsets:
              - image
            multiple: false
            required: true
          name:
            type: text
            width: 1/2
            required: true
          occupation:
            type: text
            width: 1/2
          filters:
            type: multiselect
            label: Filters
            options:
              type: query
              query: site.find('community').filters.toStructure.pluck('tags', ',')
              text: "[{{ site.find('community').getTagGroup(item.value) }}] {{ item.value }}"

          contact: fields/contact

  files:
    width: 1/3
    sections:
      files:
        headline: Media
